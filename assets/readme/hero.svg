<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Codex Usage Companion</title>
  <desc id="desc">Windows Codex 个人额度伴侣，把剩余额度和重置倒计时固定在 Codex 标题栏。</desc>

  <rect width="1200" height="400" rx="30" fill="#101318"/>
  <path d="M668 0v400" stroke="#272c35"/>
  <path d="M0 332h1200" stroke="#272c35"/>

  <g id="title-block" transform="translate(62 54)">
    <g>
      <rect width="48" height="48" rx="14" fill="#2f91f6"/>
      <text x="24" y="33" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="26" font-weight="700">C</text>
      <text x="64" y="18" fill="#65b9ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="1.5">WINDOWS · PERSONAL USAGE</text>
      <text x="64" y="43" fill="#9fa3ad" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">TITLE BAR + TRAY COMPANION</text>
    </g>

    <text x="0" y="124" fill="#f7f7f3" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="58" font-weight="720" letter-spacing="-1.5">Codex Usage</text>
    <text x="0" y="181" fill="#f7f7f3" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="58" font-weight="720" letter-spacing="-1.5">Companion</text>
    <text x="0" y="231" fill="#c9cdd5" font-family="Microsoft YaHei UI, Segoe UI, sans-serif" font-size="25" font-weight="600">把个人额度和重置倒计时，固定在 Codex 标题栏</text>
  </g>

  <g id="product-proof" transform="translate(716 50)">
    <rect width="424" height="234" rx="22" fill="#171b22" stroke="#343a45"/>
    <circle cx="26" cy="24" r="5" fill="#434a56"/>
    <circle cx="44" cy="24" r="5" fill="#434a56"/>
    <circle cx="62" cy="24" r="5" fill="#434a56"/>
    <text x="84" y="30" fill="#8e95a1" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">CODEX TITLE BAR</text>

    <g transform="translate(24 48)">
      <rect width="376" height="54" rx="27" fill="#fafaf7"/>
      <circle cx="24" cy="27" r="5" fill="#2f91f6"/>
      <text x="38" y="32" fill="#747983" font-family="Microsoft YaHei UI, Segoe UI, sans-serif" font-size="18" font-weight="600">连续 12 天</text>
      <text x="134" y="32" fill="#747983" font-family="Microsoft YaHei UI, Segoe UI, sans-serif" font-size="18">周剩余</text>
      <text x="194" y="33" fill="#2f91f6" font-family="Segoe UI, sans-serif" font-size="20" font-weight="750">19%</text>
      <path d="M245 18v18" stroke="#dfe2e6"/>
      <text x="260" y="32" fill="#747983" font-family="Microsoft YaHei UI, Segoe UI, sans-serif" font-size="18" font-weight="600">2天后重置</text>
    </g>

    <g transform="translate(24 124)">
      <rect width="180" height="82" rx="15" fill="#1e232c" stroke="#343a45"/>
      <text x="18" y="27" fill="#8e95a1" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">PERSONAL LIMITS</text>
      <text x="18" y="61" fill="#65b9ff" font-family="Segoe UI, sans-serif" font-size="28" font-weight="750">1 MIN</text>
      <text x="103" y="60" fill="#c9cdd5" font-family="Microsoft YaHei UI, Segoe UI, sans-serif" font-size="18">自动刷新</text>
      <rect x="196" width="180" height="82" rx="15" fill="#1e232c" stroke="#343a45"/>
      <text x="214" y="27" fill="#8e95a1" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">LOCAL SERVICE</text>
      <text x="214" y="60" fill="#f7f7f3" font-family="Microsoft YaHei UI, Segoe UI, sans-serif" font-size="18" font-weight="650">无需 API Key</text>
    </g>
  </g>

  <g id="metadata" transform="translate(62 360)" fill="#9fa3ad" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="0.6">
    <circle cx="5" cy="-5" r="5" fill="#2f91f6"/>
    <text x="20" y="0">WINDOWS X64</text>
    <text x="166" y="0">PORTABLE EXE</text>
    <text x="334" y="0">LOCAL-FIRST</text>
    <text x="742" y="0">CODEX APP SERVER</text>
    <text x="948" y="0">SYSTEM TRAY</text>
  </g>
</svg>
